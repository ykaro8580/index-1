<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar</title>
<link rel="icon" type="image/png" href="assets/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,500;125,700&family=Instrument+Serif&family=Urbanist:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root { --preto:#000; --noite:#060102; --vermelho:#f0142f; --carmim:#c10a1f; --vinho:#4a0309; --branco:#fff; }
* { margin:0; padding:0; box-sizing:border-box; }
[hidden] { display:none !important; }
::selection { background:var(--vermelho); color:#fff; }

body {
    min-height:100dvh; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:30px; padding:76px 20px 40px; color:var(--branco); font:300 16px 'Urbanist', sans-serif;
    background:
        radial-gradient(70% 28% at 50% 66%, rgba(240,20,47,.55), transparent 72%),
        var(--preto);
    background-attachment:fixed;
}

/* barras verticais borradas, como uma onda de áudio */
body::before {
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.6; filter:blur(.6px);
    background:repeating-linear-gradient(90deg,
        transparent 0 4px, rgba(255,24,48,.9) 4px 5px, transparent 5px 8px,
        rgba(255,24,48,.45) 8px 9px, transparent 9px 14px, rgba(255,24,48,.7) 14px 15px, transparent 15px 19px);
    -webkit-mask-image:
        radial-gradient(ellipse 60% 20% at 12% 12%, #000, transparent 100%),
        radial-gradient(ellipse 55% 16% at 92% 34%, #000, transparent 100%);
    mask-image:
        radial-gradient(ellipse 60% 20% at 12% 12%, #000, transparent 100%),
        radial-gradient(ellipse 55% 16% at 92% 34%, #000, transparent 100%);
}

/* arco de horizonte com borda brilhante */
.arco {
    position:fixed; z-index:-2; left:-50vw; top:62vh; width:200vw; height:100vh; border-radius:50%; pointer-events:none;
    background:linear-gradient(180deg, #000 0%, #000 7%, #2a0207 18%, #8a0712 29%, #e0101f 38%);
    box-shadow:0 -6px 40px rgba(240,20,47,.75), 0 -1px 0 rgba(255,80,95,.95), inset 0 26px 60px -24px rgba(240,20,47,.5);
}

/* linha de topo: [índice] ——— [lado] */
.cabeca {
    position:absolute; top:calc(22px + env(safe-area-inset-top, 0px)); left:20px; right:20px;
    display:flex; align-items:center; gap:14px;
    font:700 10px 'Archivo', sans-serif; font-stretch:125%; letter-spacing:.16em; text-transform:uppercase; color:var(--vermelho);
}
.cabeca i { flex:1; height:1px; background:linear-gradient(90deg, var(--vermelho), rgba(240,20,47,.25)); }

/* disco: a única peça que se move sozinha; acelera quando está enviando */
.disco { position:relative; width:min(46vw, 200px); aspect-ratio:1; }
.disco::before {
    content:""; position:absolute; inset:-26%; z-index:-1; filter:blur(28px);
    background:radial-gradient(circle, rgba(240,20,47,.7), rgba(193,10,31,.3) 45%, transparent 70%);
}
.vinil {
    position:absolute; inset:0; border-radius:50%;
    background:
        repeating-radial-gradient(circle, rgba(255,255,255,.05) 0 1px, transparent 1px 4px),
        conic-gradient(from 20deg, #050102, #3a030a 12%, #050102 25%, #c10a1f 38%, #050102 50%, #3a030a 62%, #050102 75%, #f0142f 88%, #050102);
    box-shadow:0 0 0 1px rgba(240,20,47,.75), 0 0 40px rgba(240,20,47,.45), 0 20px 60px rgba(0,0,0,.7);
    animation:girar 9s linear infinite;
}
.disco.carregando .vinil { animation-duration:1.4s; }
.rotulo {
    position:absolute; top:50%; left:50%; width:38%; height:38%; transform:translate(-50%,-50%);
    border-radius:50%; display:grid; place-items:center;
    background:radial-gradient(circle at 35% 30%, #ff4a5c, var(--vermelho) 45%, var(--carmim));
    box-shadow:0 0 0 5px rgba(0,0,0,.75), 0 0 22px rgba(240,20,47,.65);
}
.rotulo svg { width:54%; height:54%; filter:drop-shadow(0 0 4px #fff); }
.furo { position:absolute; top:50%; left:50%; width:5%; height:5%; transform:translate(-50%,-50%); border-radius:50%; background:var(--preto); box-shadow:0 0 0 2px rgba(255,255,255,.7); }
@keyframes girar { to { transform:rotate(360deg); } }

/* cartão de vidro escuro */
.card {
    width:min(380px, 100%); padding:28px;
    background:linear-gradient(160deg, rgba(42,42,42,.62), rgba(0,0,0,.82));
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border:1px solid rgba(240,20,47,.5); border-radius:16px;
    box-shadow:0 0 44px rgba(240,20,47,.2), 0 20px 50px rgba(0,0,0,.5);
}
h1 {
    font:400 clamp(44px, 13vw, 60px)/.9 'Instrument Serif', serif; text-transform:uppercase; letter-spacing:-.01em;
    color:var(--vermelho); margin-bottom:26px;
    text-shadow:0 0 14px rgba(240,20,47,.85), 0 0 46px rgba(240,20,47,.5);
}
form { counter-reset:c; }
.campo { display:block; margin-bottom:20px; counter-increment:c; }
.campo span {
    display:block; margin-bottom:6px;
    font:700 10px 'Archivo', sans-serif; font-stretch:125%; letter-spacing:.14em; text-transform:uppercase; color:var(--vermelho);
}
.campo span::before { content:"[" counter(c, decimal-leading-zero) "] "; color:var(--branco); }
input {
    width:100%; padding:8px 0; background:transparent; color:var(--branco);
    border:none; border-bottom:1px solid rgba(255,255,255,.28); font:400 16px 'Urbanist', sans-serif;
    transition:border-color .2s, box-shadow .2s;
}
input:focus-visible { outline:none; border-bottom-color:var(--vermelho); box-shadow:0 1px 0 var(--vermelho); }
input:-webkit-autofill { -webkit-text-fill-color:#fff; transition:background-color 9999s; }
button { font:inherit; cursor:pointer; }
.principal {
    width:100%; margin-top:10px; padding:14px; border:none; border-radius:12px; color:var(--branco);
    background:linear-gradient(180deg, #ff2a3f, var(--carmim));
    font:700 12px 'Archivo', sans-serif; font-stretch:125%; letter-spacing:.14em; text-transform:uppercase;
    box-shadow:0 0 26px rgba(240,20,47,.55); transition:transform .2s, box-shadow .2s;
}
.principal:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 0 38px rgba(240,20,47,.8); }
.principal:disabled { opacity:.6; cursor:wait; }
.trocar {
    display:block; margin:20px auto 0; background:none; border:none; color:rgba(255,255,255,.85);
    font:500 10px 'Archivo', sans-serif; font-stretch:125%; letter-spacing:.12em; text-transform:uppercase; text-decoration:underline; text-underline-offset:4px;
}
button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
.msg { min-height:1.4em; margin-top:14px; font-size:14px; font-weight:400; color:#ff6b7a; }

@media (prefers-reduced-motion: reduce) { .vinil { animation:none; } }
</style>
</head>
<body>
    <div class="arco" aria-hidden="true"></div>
    <div class="cabeca" aria-hidden="true"><span>Index</span><i></i><span>Lado A</span></div>

    <div class="disco" id="disco">
        <div class="vinil"><span class="rotulo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12.8 8 16 11.2 24 12C16 12.8 12.8 16 12 24C11.2 16 8 12.8 0 12C8 11.2 11.2 8 12 0Z" fill="#fff"/></svg></span><span class="furo"></span></div>
    </div>

    <main class="card">
        <form id="form">
            <h1 id="titulo">Entrar</h1>
            <label class="campo" id="campo-nome" hidden>
                <span>Seu nome</span>
                <input id="nome" autocomplete="name" maxlength="40">
            </label>
            <label class="campo">
                <span>Usuário</span>
                <input id="usuario" autocomplete="username" autocapitalize="none" required>
            </label>
            <label class="campo">
                <span>Senha</span>
                <input id="senha" type="password" autocomplete="current-password" required>
            </label>
            <label class="campo" id="campo-convite" hidden>
                <span>Código de convite</span>
                <input id="convite" autocomplete="off" autocapitalize="none">
            </label>
            <button class="principal" id="enviar" type="submit">Entrar</button>
            <button class="trocar" id="trocar" type="button">Quero criar uma conta</button>
            <p class="msg" id="msg" role="alert"></p>
        </form>
        <div id="ola" hidden>
            <h1 id="ola-nome"></h1>
            <p>Você está dentro. O feed vem na próxima etapa.</p>
        </div>
    </main>

<script src="config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let modo = "login";

// sem cabeçalho Content-Type, o navegador não faz preflight e o Apps Script aceita
async function chamar(dados) {
    const r = await fetch(API, { method: "POST", body: JSON.stringify(dados) });
    return r.json();
}

function aplicarModo() {
    const criando = modo === "cadastrar";
    $("titulo").textContent = criando ? "Criar conta" : "Entrar";
    $("enviar").textContent = criando ? "Criar conta" : "Entrar";
    $("trocar").textContent = criando ? "Já tenho conta" : "Quero criar uma conta";
    $("campo-nome").hidden = !criando;
    $("campo-convite").hidden = !criando;
    $("senha").autocomplete = criando ? "new-password" : "current-password";
    $("msg").textContent = "";
}

function entrou(usuario) {
    $("form").hidden = true;
    $("ola").hidden = false;
    $("ola-nome").textContent = "Oi, @" + usuario;
    location.href = "feed.html";
}

$("trocar").addEventListener("click", () => {
    modo = modo === "login" ? "cadastrar" : "login";
    aplicarModo();
});

$("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (API.startsWith("COLE")) {
        $("msg").textContent = "Falta colar a URL do Apps Script no começo do código.";
        return;
    }
    $("enviar").disabled = true;
    $("disco").classList.add("carregando");
    $("msg").textContent = "";
    try {
        const r = await chamar({ acao: modo, usuario: $("usuario").value, senha: $("senha").value, nome: $("nome").value, convite: $("convite").value });
        if (!r.ok) throw new Error(r.erro);
        try { localStorage.setItem("token", r.token); } catch (err) {}
        entrou(r.usuario);
    } catch (err) {
        $("msg").textContent = err.message || "Sem conexão com o servidor. Tente de novo.";
    } finally {
        $("enviar").disabled = false;
        $("disco").classList.remove("carregando");
    }
});

// já tem sessão salva? entra direto
(async () => {
    if (API.startsWith("COLE")) return;
    let token = null;
    try { token = localStorage.getItem("token"); } catch (err) {}
    if (!token) return;
    try {
        const r = await chamar({ acao: "eu", token });
        if (r.ok) entrou(r.usuario);
    } catch (err) {}
})();
</script>
</body>
</html>
