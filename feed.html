<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed</title>
<link rel="icon" type="image/png" href="assets/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,500;125,700&family=Instrument+Serif&family=Urbanist:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="barra">
    <a class="marca" href="feed.html">Index</a>
    <span class="linha" aria-hidden="true"></span>
    <button id="novo" class="novo">Novo post</button>
    <button id="perfil-btn" hidden>Perfil</button>
    <button id="sair">Sair</button>
</header>

<main id="lista"></main>

<dialog id="dialogo">
    <form id="form">
        <h2>Novo post</h2>
        <label class="campo"><span>Foto</span><input id="imagem" type="file" accept="image/*"></label>
        <label class="campo"><span>Música autoral</span><input id="audio" type="file" accept="audio/*"></label>
        <div class="gravador">
            <button type="button" id="gravar">Gravar agora</button>
            <span id="tempo"></span>
            <audio id="previa" controls hidden></audio>
        </div>
        <label class="campo"><span>Título da música</span><input id="titulo-post" maxlength="60"></label>
        <label class="campo"><span>Legenda</span><textarea id="legenda-post" rows="2" maxlength="200"></textarea></label>
        <div class="acoes">
            <button type="button" id="cancelar">Cancelar</button>
            <button type="submit" class="postar" id="postar">Postar</button>
        </div>
        <p class="msg" id="msg" role="alert"></p>
    </form>
</dialog>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const perfil = new URLSearchParams(location.search).get("u");
const token = (() => { try { return localStorage.getItem("token"); } catch (e) { return null; } })();
if (!token) location.replace("login.html");

async function chamar(dados) {
    const r = await fetch(API, { method: "POST", body: JSON.stringify({ token, ...dados }) });
    const j = await r.json();
    if (!j.ok && /Sessão expirada/.test(j.erro || "")) sair();
    return j;
}
function sair() {
    try { localStorage.removeItem("token"); } catch (e) {}
    location.replace("login.html");
}
$("sair").addEventListener("click", sair);
$("perfil-btn").addEventListener("click", () => { location.href = "feed.html?u=" + encodeURIComponent(meuUsuario); });

function el(tag, classe, texto) {
    const e = document.createElement(tag);
    if (classe) e.className = classe;
    if (texto !== undefined) e.textContent = texto;
    return e;
}
const urlImagem = (id) => "https://lh3.googleusercontent.com/d/" + id;
const formatarData = (iso) => new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });

/* ---------- player: uma música por vez ---------- */
const audio = new Audio();
let atual = null;
let meuUsuario = "";
let aba = "posts", sequencia = false, fila = [];
function soltar() {
    if (!atual) return;
    atual.botao.textContent = "▶";
    atual.vinil.classList.remove("tocando");
    atual = null;
}
audio.addEventListener("play", () => { if (atual) { atual.botao.textContent = "⏸"; atual.vinil.classList.add("tocando"); } });
audio.addEventListener("pause", () => { if (atual) { atual.botao.textContent = "▶"; atual.vinil.classList.remove("tocando"); } });
// na playlist, ao terminar uma música toca a próxima da lista
audio.addEventListener("ended", () => {
    const i = atual ? fila.findIndex((x) => x.post.id === atual.id) : -1;
    const prox = sequencia && i >= 0 ? fila[i + 1] : null;
    soltar();
    if (prox) alternar(prox.post, prox.botao, prox.vinil);
});
const cacheAudio = new Map();
async function urlDoAudio(post) {
    if (cacheAudio.has(post.id)) return cacheAudio.get(post.id);
    const r = await chamar({ acao: "baixarAudio", post_id: post.id });
    if (!r.ok) throw new Error(r.erro);
    const bytes = Uint8Array.from(atob(r.dados), (c) => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], { type: r.mime }));
    cacheAudio.set(post.id, url);
    return url;
}
async function alternar(post, botao, vinil) {
    if (atual && atual.id === post.id) { audio.paused ? audio.play() : audio.pause(); return; }
    audio.pause();
    soltar();
    atual = { id: post.id, botao, vinil };
    botao.textContent = "…";
    botao.disabled = true;
    try {
        audio.src = await urlDoAudio(post);
        if (!atual || atual.id !== post.id) return; // clicou em outra música enquanto carregava
        await audio.play();
    } catch (err) {
        if (atual && atual.id === post.id) soltar();
        alert(err.message || "Não foi possível tocar a música.");
    } finally {
        botao.disabled = false;
    }
}

/* ---------- salvar na playlist e comentários ---------- */
function botaoSalvar(p) {
    const b = el("button", "curtir");
    let salvo = p.salvo;
    const pintar = () => { b.textContent = salvo ? "Salvo" : "Salvar"; b.setAttribute("aria-pressed", salvo); };
    pintar();
    b.addEventListener("click", async () => {
        salvo = !salvo; pintar();
        const r = await chamar({ acao: "salvar", post_id: p.id }).catch(() => ({ ok: false }));
        if (!r.ok) { salvo = !salvo; pintar(); }
    });
    return b;
}

function painelComentarios(p, botao) {
    const caixa = el("div", "comentarios");
    caixa.hidden = true;
    const lista = el("div", "lista-coment");
    const form = el("form", "form-coment");
    const campo = el("input");
    campo.placeholder = "Escreva um comentário";
    campo.maxLength = 300;
    campo.setAttribute("aria-label", "Comentário");
    const enviar = el("button", "curtir", "Enviar");
    enviar.type = "submit";
    form.append(campo, enviar);
    caixa.append(lista, form);

    let total = p.comentarios, carregado = false;
    const rotulo = () => { botao.textContent = "Comentários (" + total + ")"; };
    rotulo();

    const linha = (c) => {
        const l = el("p", "coment");
        l.append(el("strong", "", "@" + c.usuario), " ", c.texto);
        if (c.pode) {
            const x = el("button", "", "Apagar");
            x.addEventListener("click", async () => {
                x.disabled = true;
                const r = await chamar({ acao: "apagarComentario", comentario_id: c.id }).catch(() => ({ ok: false, erro: "Sem conexão com o servidor." }));
                if (!r.ok) { x.disabled = false; alert(r.erro); return; }
                l.remove(); total--; rotulo();
            });
            l.append(x);
        }
        return l;
    };

    botao.addEventListener("click", async () => {
        caixa.hidden = !caixa.hidden;
        if (caixa.hidden || carregado) return;
        lista.replaceChildren(el("p", "vazio-coment", "Carregando…"));
        const r = await chamar({ acao: "comentarios", post_id: p.id }).catch(() => ({ ok: false, erro: "Sem conexão com o servidor." }));
        if (!r.ok) { lista.replaceChildren(el("p", "vazio-coment", r.erro)); return; }
        carregado = true;
        lista.replaceChildren(...(r.comentarios.length ? r.comentarios.map(linha) : [el("p", "vazio-coment", "Ainda sem comentários.")]));
    });

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const texto = campo.value.trim();
        if (!texto || !carregado) return;
        enviar.disabled = true;
        const r = await chamar({ acao: "comentar", post_id: p.id, texto }).catch(() => ({ ok: false, erro: "Sem conexão com o servidor." }));
        enviar.disabled = false;
        if (!r.ok) { alert(r.erro); return; }
        lista.querySelector(".vazio-coment")?.remove();
        lista.append(linha(r.comentario));
        campo.value = ""; total++; rotulo();
    });
    return caixa;
}

/* ---------- cartão de post ---------- */
function cartao(p) {
    const a = el("article", "post");
    const topo = el("header", "topo");
    const autor = el("a", "autor", "@" + p.usuario);
    autor.href = "feed.html?u=" + encodeURIComponent(p.usuario);
    topo.append(autor, el("time", "data", formatarData(p.criado_em)));
    a.append(topo);

    if (p.audio) {
        const disco = el("div", "disco"), vinil = el("div", "vinil"), rotulo = el("span", "rotulo");
        if (p.imagem) {
            const i = new Image();
            i.src = urlImagem(p.imagem);
            i.alt = "Capa de " + p.titulo;
            rotulo.append(i);
        } else rotulo.textContent = "♪";
        vinil.append(rotulo, el("span", "furo"));
        disco.append(vinil);
        const botao = el("button", "tocar", "▶");
        botao.setAttribute("aria-label", "Tocar " + p.titulo);
        botao.addEventListener("click", () => alternar(p, botao, vinil));
        fila.push({ post: p, botao, vinil });
        a.append(disco, botao);
    } else if (p.imagem) {
        const i = el("img", "foto");
        i.src = urlImagem(p.imagem);
        i.alt = p.legenda || "Foto de @" + p.usuario;
        i.loading = "lazy";
        a.append(i);
    }
    if (p.titulo) a.append(el("h2", "titulo", p.titulo));
    if (p.legenda) a.append(el("p", "legenda", p.legenda));

    const curtir = el("button", "curtir");
    let curti = p.curti, total = p.curtidas;
    const pintar = () => { curtir.textContent = "♥ " + total; curtir.setAttribute("aria-pressed", curti); };
    pintar();
    curtir.addEventListener("click", async () => {
        curti = !curti; total += curti ? 1 : -1; pintar();
        const r = await chamar({ acao: "curtir", post_id: p.id }).catch(() => ({ ok: false }));
        if (!r.ok) { curti = !curti; total += curti ? 1 : -1; pintar(); }
    });
    const rodape = el("div", "rodape");
    rodape.append(curtir);
    if (p.audio) rodape.append(botaoSalvar(p));
    const botaoComent = el("button", "curtir");
    rodape.append(botaoComent);
    a.append(rodape, painelComentarios(p, botaoComent));
    if (p.usuario === meuUsuario) {
        const apagar = el("button", "apagar", "Apagar");
        apagar.addEventListener("click", async () => {
            if (!confirm("Apagar este post? Não dá para desfazer.")) return;
            apagar.disabled = true;
            const r = await chamar({ acao: "apagar", post_id: p.id }).catch(() => ({ ok: false, erro: "Sem conexão com o servidor." }));
            if (!r.ok) { apagar.disabled = false; alert(r.erro); return; }
            if (atual && atual.id === p.id) { audio.pause(); soltar(); }
            a.remove();
        });
        rodape.append(apagar);
    }
    return a;
}

/* ---------- carregar ---------- */
async function carregar() {
    const lista = $("lista");
    lista.replaceChildren();
    fila = [];
    sequencia = !!perfil && aba === "playlist";
    if (perfil) {
        const v = el("a", "voltar", "← Voltar ao feed");
        v.href = "feed.html";
        const abas = el("div", "abas");
        [["posts", "Posts"], ["playlist", "Playlist"]].forEach(([id, nome]) => {
            const b = el("button", "curtir", nome);
            b.setAttribute("aria-pressed", aba === id);
            b.addEventListener("click", () => { if (aba !== id) { aba = id; audio.pause(); soltar(); carregar(); } });
            abas.append(b);
        });
        lista.append(v, el("h1", "perfil", "@" + perfil), abas);
        document.title = "@" + perfil;
    }
    let r;
    try { r = await chamar(sequencia ? { acao: "playlist", usuario: perfil } : { acao: "feed", usuario: perfil }); }
    catch (e) { lista.append(el("p", "vazio", "Sem conexão com o servidor. Recarregue a página.")); return; }
    if (!r.ok) { lista.append(el("p", "vazio", r.erro)); return; }
    meuUsuario = r.eu;
    $("perfil-btn").hidden = false;
    if (!r.posts.length) {
        lista.append(el("p", "vazio", sequencia ? "@" + perfil + " ainda não salvou nenhuma música." : perfil ? "@" + perfil + " ainda não postou nada." : "Ainda não tem nada por aqui. Faça o primeiro post."));
        return;
    }
    r.posts.forEach((p) => lista.append(cartao(p)));
}

/* ---------- novo post ---------- */
const dialogo = $("dialogo");
$("novo").addEventListener("click", () => { $("msg").textContent = ""; dialogo.showModal(); });
$("cancelar").addEventListener("click", () => dialogo.close());

const lerBase64 = (file) => new Promise((ok, erro) => {
    const r = new FileReader();
    r.onload = () => ok(r.result.split(",")[1]);
    r.onerror = () => erro(new Error("Não foi possível ler o arquivo."));
    r.readAsDataURL(file);
});
// reduz a foto para 1080 px e converte para jpg antes de enviar
const reduzirFoto = (file) => new Promise((ok, erro) => {
    const img = new Image();
    img.onload = () => {
        const k = Math.min(1, 1080 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        ok(c.toDataURL("image/jpeg", 0.85).split(",")[1]);
    };
    img.onerror = () => erro(new Error("Não foi possível ler a foto. Tente outra ou tire um print dela."));
    img.src = URL.createObjectURL(file);
});

/* ---------- gravar música direto no site ---------- */
const PODE_GRAVAR = !!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
const MAX_GRAVACAO = 240; // segundos; em mp3 de 128 kbps dá cerca de 4 MB
let gravador = null, fluxo = null, pedacos = [], gravacao = null, cronometro = null, inicio = 0;
const rotuloTempo = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

function limparGravacao() {
    clearInterval(cronometro);
    if (gravador && gravador.state !== "inactive") { gravador.onstop = null; gravador.stop(); }
    if (fluxo) fluxo.getTracks().forEach((t) => t.stop());
    gravador = fluxo = gravacao = null;
    pedacos = [];
    $("previa").hidden = true;
    $("previa").removeAttribute("src");
    $("tempo").textContent = "";
    $("gravar").textContent = "Gravar agora";
    $("gravar").classList.remove("gravando");
    $("gravar").disabled = false;
}

// o Android grava em webm e o iPhone pode não tocar; em mp3 toca em qualquer aparelho
async function paraMp3(blob) {
    if (!window.lamejs) return null;
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
    ctx.close();
    const canal = buf.getChannelData(0);
    const pcm = new Int16Array(canal.length);
    for (let i = 0; i < canal.length; i++) {
        const v = Math.max(-1, Math.min(1, canal[i]));
        pcm[i] = v < 0 ? v * 32768 : v * 32767;
    }
    const enc = new lamejs.Mp3Encoder(1, buf.sampleRate, 128);
    const partes = [];
    for (let i = 0; i < pcm.length; i += 1152) {
        const o = enc.encodeBuffer(pcm.subarray(i, i + 1152));
        if (o.length) partes.push(o);
    }
    const fim = enc.flush();
    if (fim.length) partes.push(fim);
    return new Blob(partes, { type: "audio/mpeg" });
}

async function terminarGravacao() {
    clearInterval(cronometro);
    fluxo.getTracks().forEach((t) => t.stop());
    const segundos = Math.min(MAX_GRAVACAO, Math.round((Date.now() - inicio) / 1000));
    const bruto = new Blob(pedacos, { type: gravador.mimeType });
    $("gravar").classList.remove("gravando");
    $("gravar").disabled = true;
    $("postar").disabled = true;
    $("msg").textContent = "Preparando a gravação…";
    try {
        const mp3 = await paraMp3(bruto).catch(() => null);
        gravacao = mp3
            ? new File([mp3], "gravacao.mp3", { type: "audio/mpeg" })
            : new File([bruto], "gravacao." + (/mp4/.test(bruto.type) ? "m4a" : "webm"), { type: bruto.type });
        $("audio").value = "";
        $("previa").src = URL.createObjectURL(gravacao);
        $("previa").hidden = false;
        $("tempo").textContent = rotuloTempo(segundos);
        $("gravar").textContent = "Regravar";
        $("msg").textContent = "";
    } finally {
        $("gravar").disabled = false;
        $("postar").disabled = false;
    }
}

async function alternarGravacao() {
    if (gravador && gravador.state === "recording") { gravador.stop(); return; }
    limparGravacao();
    $("msg").textContent = "";
    try {
        fluxo = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    } catch (err) {
        $("msg").textContent = "Não consegui usar o microfone. Libere a permissão no navegador e tente de novo.";
        return;
    }
    gravador = new MediaRecorder(fluxo);
    gravador.ondataavailable = (e) => { if (e.data.size) pedacos.push(e.data); };
    gravador.onstop = terminarGravacao;
    gravador.start();
    inicio = Date.now();
    $("gravar").textContent = "Parar";
    $("gravar").classList.add("gravando");
    cronometro = setInterval(() => {
        const s = (Date.now() - inicio) / 1000;
        $("tempo").textContent = rotuloTempo(s) + " / " + rotuloTempo(MAX_GRAVACAO);
        if (s >= MAX_GRAVACAO) gravador.stop();
    }, 250);
}

if (PODE_GRAVAR) $("gravar").addEventListener("click", alternarGravacao);
else document.querySelector(".gravador").hidden = true;
$("audio").addEventListener("change", () => { if ($("audio").files[0]) limparGravacao(); });
dialogo.addEventListener("close", limparGravacao);

const MIME_POR_EXTENSAO = { mp3:"audio/mpeg", m4a:"audio/mp4", mp4:"audio/mp4", aac:"audio/aac", wav:"audio/wav", ogg:"audio/ogg", oga:"audio/ogg", webm:"audio/webm" };
// o iPhone costuma mandar o tipo da música vazio ou diferente do padrão, então vale a extensão primeiro
const mimeDoAudio = (file) => MIME_POR_EXTENSAO[file.name.split(".").pop().toLowerCase()] || file.type;

$("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const foto = $("imagem").files[0], musica = gravacao || $("audio").files[0];
    const msg = $("msg");
    if (!foto && !musica) { msg.textContent = "Escolha uma foto, uma música ou as duas."; return; }
    if (musica && musica.size > 8 * 1024 * 1024) { msg.textContent = "A música passa de 8 MB. Comprima o arquivo."; return; }
    const mimeAudio = musica ? mimeDoAudio(musica) : "";
    if (musica && !mimeAudio.startsWith("audio/")) {
        msg.textContent = "Não reconheci esse formato de música (" + (musica.type || musica.name.split(".").pop()) + "). Use mp3, m4a ou wav.";
        return;
    }
    $("postar").disabled = true;
    msg.textContent = "Enviando…";
    try {
        const r = await chamar({
            acao: "postar",
            titulo: $("titulo-post").value, legenda: $("legenda-post").value,
            imagem: foto ? await reduzirFoto(foto) : "", imagem_mime: "image/jpeg",
            audio: musica ? await lerBase64(musica) : "", audio_mime: mimeAudio
        });
        if (!r.ok) throw new Error(r.erro);
        $("form").reset();
        dialogo.close();
        carregar();
    } catch (err) {
        msg.textContent = err.message || "Não foi possível postar. Tente de novo.";
    } finally {
        $("postar").disabled = false;
    }
});

if (token) carregar();
</script>
</body>
</html>
